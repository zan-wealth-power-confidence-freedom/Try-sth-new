<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>保持觉知</title>
    <style>
        /* 1. 温暖的渐变背景和居中布局 */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            /* 暖色调渐变背景，从奶油白过渡到淡淡的蜜桃色 */
            background: linear-gradient(135deg, #fffcf5 0%, #ffe8d6 100%);
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            overflow-x: hidden;
        }

        /* 2. “保持觉知”文字动画与排版 */
        h1 {
            font-size: 2.8rem;
            letter-spacing: 0.8rem;
            margin-bottom: 2.5rem;
            font-weight: 400;
            color: #5c4a43;
            /* 给文字加上轻微的光晕 */
            text-shadow: 0 4px 15px rgba(255, 160, 122, 0.3);
            /* 呼吸感动画：3秒一次循环，缓慢放大缩小 */
            animation: breathe 3s ease-in-out infinite;
        }

        /* 定义呼吸动画 */
        @keyframes breathe {
            0% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.03); opacity: 1; }
            100% { transform: scale(1); opacity: 0.9; }
        }

        /* 3. 小猫相框：限制高度防止撑破屏幕 */
        .cat-image {
            /* 核心修复：限制最高高度，确保能在屏幕内完整显示 */
            max-height: 55vh;
            max-width: 85vw;
            width: auto;
            object-fit: contain;
            
            /* 拍立得风格边框和柔和阴影 */
            border: 12px solid #ffffff;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1), 
                        0 5px 15px rgba(0, 0, 0, 0.05);
            
            transition: all 0.4s ease;
        }

        /* 鼠标放上去，相框微微上浮 */
        .cat-image:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.15), 
                        0 10px 20px rgba(0, 0, 0, 0.08);
        }

        /* 底部小字 */
        .footer-text {
            margin-top: 2.5rem;
            font-size: 0.9rem;
            color: #a68a7d;
            letter-spacing: 0.3rem;
            font-weight: 300;
        }
    </style>
</head>
<body>

    <!-- 加上呼吸动画的标题 -->
    <h1>保持觉知</h1>

    <!-- 猫咪照片 -->
    <img src="cat.jpg" alt="可爱的小猫" class="cat-image">

    <div class="footer-text">— 按住当下 —</div>

</body>
</html>
